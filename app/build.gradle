plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nitsutech.pillscheck'
    compileSdk 34

    defaultConfig {
        applicationId "com.nitsutech.pillscheck"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "1.0.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Room Database
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // JSON serializer for blister slot state arrays
    implementation 'com.google.code.gson:gson:2.10.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

tasks.register('copyLocalSeed') {
    doLast {
        def rootSeed = file("${rootDir}/local_seed.json")
        def targetAsset = file("${projectDir}/src/main/assets/local_seed.json")
        if (rootSeed.exists()) {
            targetAsset.parentFile.mkdirs()
            targetAsset.text = rootSeed.text
            println "Copied local_seed.json to assets"
        }
    }
}

preBuild.dependsOn 'copyLocalSeed'

